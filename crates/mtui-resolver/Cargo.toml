[package]
name = "mtui-resolver"
version = "0.1.0"
edition = "2024"
description = "Low-latency, validated YouTube audio stream resolution for MTUI"
license = "MIT"
repository = "https://github.com/lightzgls/mtui"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "net", "time"] }
