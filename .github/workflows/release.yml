name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component clippy
          rustup default stable-x86_64-pc-windows-msvc

      - name: Verify release tag
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "mtui" }).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo version $version"
          }
          "MTUI_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Isolated tests and Clippy
        shell: pwsh
        run: ./scripts/test.ps1 -Suite Full -Online

      # webview2-com statically links WebView2Loader on MSVC. GNU links the DLL
      # dynamically, which would turn the release into a two-file download.
      - name: Build single-file Windows release
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked

      - name: Verify Windows runtime dependencies
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" |
            Select-Object -First 1
          if (-not $dumpbin) { throw "Could not find Visual Studio dumpbin.exe" }
          $imports = & $dumpbin /dependents target/release/mtui.exe
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect mtui.exe imports" }
          if ($imports -match "WebView2Loader\.dll") {
            throw "mtui.exe still imports WebView2Loader.dll"
          }
          if ($imports -match '(?i)VCRUNTIME\d|MSVCP\d') {
            throw "mtui.exe still requires a separately installed Visual C++ runtime"
          }

      - name: Install installer compiler
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "Inno Setup compiler was not installed at $compiler"
          }
          & $compiler "/DMyAppVersion=$env:MTUI_VERSION" installer/mtui.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $setup = "dist/MTUI-$env:MTUI_VERSION-Setup-x64.exe"
          if (-not (Test-Path -LiteralPath $setup)) {
            throw "Installer was not created at $setup"
          }
          Copy-Item target/release/mtui.exe "dist/MTUI-$env:MTUI_VERSION-windows-x64-portable.exe"

      - name: Save Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/MTUI-*.exe
          if-no-files-found: error

  linux:
    # Build against an older glibc so newer Ubuntu desktops can run the binaries.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libasound2-dev libdbus-1-dev libwebkit2gtk-4.1-dev dpkg-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Verify release tag
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "mtui" }).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo version $version"
          }
          "MTUI_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Isolated tests and Clippy
        shell: pwsh
        run: ./scripts/test.ps1 -Suite Full -Online

      - name: Build Linux player and sign-in helper
        run: cargo build --release --locked --bins

      - name: Build Linux packages
        run: bash scripts/package-linux.sh "$MTUI_VERSION" target/release dist

      - name: Save Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/MTUI-*
            dist/install.sh
          if-no-files-found: error

  linux-smoke:
    needs: linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "fedora:44", "archlinux:base", "opensuse/tumbleweed:latest"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist
      - name: Verify fresh installation and updater
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum MTUI-* install.sh > SHA256SUMS)
          docker run --rm \
            --mount "type=bind,source=$PWD/scripts,target=/source/scripts,readonly" \
            --mount "type=bind,source=$PWD/dist,target=/packages,readonly" \
            "$IMAGE" bash /source/scripts/test-linux-release.sh "$version" /packages

  publish:
    needs: [windows, linux, linux-smoke]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Collect release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum MTUI-* install.sh > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/$GITHUB_REF_NAME.md"
          notes_args=(--generate-notes)
          if [[ -f "$notes" ]]; then
            notes_args=(--notes-file "$notes")
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/MTUI-$version-Setup-x64.exe#MTUI installer for Windows (x64)" \
            "dist/MTUI-$version-windows-x64-portable.exe#Portable MTUI for Windows (x64)" \
            "dist/MTUI-$version-linux-x64.deb#MTUI package for Debian and Ubuntu (x64)" \
            "dist/MTUI-$version-linux-x64.tar.gz#MTUI archive for Linux (x64)" \
            "dist/install.sh#Linux installer (Debian, Fedora, Arch, openSUSE)" \
            "dist/SHA256SUMS#SHA-256 checksums" \
            "${notes_args[@]}" --verify-tag
